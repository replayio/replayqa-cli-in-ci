name: Replay QA · PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replayqa-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replayqa:
    # GitHub does not expose repository secrets to forked pull requests. Keep this
    # job restricted to same-repository PRs instead of running a secret-backed job
    # against untrusted fork code.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      REPLAYQA_CLI_VERSION: "0.2.2"
      REPLAYQA_PROXY_TIMEOUT_MS: "300000"
      REPLAYQA_PROXY_PORT: "18888"
      REPLAYQA_EXPLORATION_TIMEOUT_MS: "900000"
      REPLAY_QA_PROJECT_ID: ${{ secrets.REPLAY_QA_PROJECT_ID }}
      REPLAY_QA_API_KEY: ${{ secrets.REPLAY_QA_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Replay QA CLI
        run: npx --yes replayqa@${REPLAYQA_CLI_VERSION} --version

      - name: Validate Replay QA configuration
        run: |
          test -n "$REPLAY_QA_PROJECT_ID" || {
            echo "::error::REPLAY_QA_PROJECT_ID is not configured in Actions secrets."
            exit 1
          }
          test -n "$REPLAY_QA_API_KEY" || {
            echo "::error::REPLAY_QA_API_KEY is not configured in Actions secrets."
            exit 1
          }
          npx --yes replayqa@${REPLAYQA_CLI_VERSION} project \
            --ignore-config \
            --project "$REPLAY_QA_PROJECT_ID" >/dev/null
          echo "Replay QA credentials are valid for $REPLAY_QA_PROJECT_ID"

      - name: Check and build the demo app
        run: npm run check

      - name: Start the demo app
        run: |
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 >"${RUNNER_TEMP}/reminders-next.log" 2>&1 &
          echo $! >"${RUNNER_TEMP}/reminders-next.pid"

          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat "${RUNNER_TEMP}/reminders-next.log"
            exit 1
          fi

          echo "Demo app is serving on http://127.0.0.1:3000"

      - name: Connect the local app through Replay QA and start a test run
        env:
          REPLAYQA_PROXY_LOG: ${{ runner.temp }}/replayqa-proxy.jsonl
        run: npm run qa:ci

      - name: Upload Replay QA and app logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replayqa-ci-logs
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/replayqa-proxy.jsonl
            ${{ runner.temp }}/reminders-next.log
